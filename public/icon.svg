  <circle cx="256" cy="256" r="216" fill="none" stroke="#facc15" stroke-width="8" stroke-dasharray="16 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#facc15" stroke-width="4" opacity="0.8"/>

